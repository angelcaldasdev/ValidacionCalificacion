<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Consolidado | Evaluación de Estudiante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="contenedor">

        <!-- Encabezado -->
        <header class="encabezado">
            <span class="etiqueta">☕ Java + Web</span>
            <h1>Evaluación de Estudiante</h1>
            <p>Ingresa los datos y descubre la clasificación académica.</p>
        </header>

        <!-- Formulario -->
        <form id="formularioEstudiante" class="tarjeta" novalidate>

            <div class="campo">
                <label for="nombreApellido">Nombre y apellido</label>
                <input type="text" id="nombreApellido" placeholder="Ej: Angel Caldas" required>
            </div>

            <div class="fila">
                <div class="campo">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" placeholder="Ej: 27" step="1" required>
                </div>

                <div class="campo">
                    <label for="nota">Nota (0 - 20)</label>
                    <input type="number" id="nota" placeholder="Ej: 15" step="1" required>
                </div>
            </div>

            <p id="mensajeError" class="mensaje-error" hidden></p>

            <button type="submit" class="boton">Evaluar estudiante</button>
        </form>

        <!-- Resultados (se muestra solo después de evaluar) -->
        <section id="tarjetaResultados" class="tarjeta resultados" hidden>
            <h2>📋 Resultados</h2>

            <ul class="lista-resultados">
                <li><span>Estudiante</span><strong id="resEstudiante"></strong></li>
                <li><span>Edad</span><strong id="resEdad"></strong></li>
                <li><span>Nota</span><strong id="resNota"></strong></li>
                <li><span>Clasificación</span><strong id="resClasificacion"></strong></li>
                <li><span>Estado</span><strong id="resEstado"></strong></li>
            </ul>
        </section>

        <footer class="pie">
            Hecho con 💙 por Angel Caldas · Camino a Java Full Stack Developer
        </footer>
    </main>

    <script src="funciones.js"></script>
</body>
</html>
